version: '3.8'

services:
  db:
    image: postgres:15
    container_name: team_AAA
    ports:
      - "5434:5432" 
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aimd
    volumes:
      - aimd_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  aimd_data:
